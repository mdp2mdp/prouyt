name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Defaults serve https://mdp2mdp.github.io/prouyt/.
      # For the custom domain set repository variables (Settings → Secrets and variables → Actions → Variables):
      #   SITE_URL = https://prouyt.ru     BASE_PATH = /
      SITE_URL: ${{ vars.SITE_URL || 'https://mdp2mdp.github.io' }}
      BASE_PATH: ${{ vars.BASE_PATH || '/prouyt' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install, build and upload the Pages artifact
        uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
